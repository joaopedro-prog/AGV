# ==============================================================================
# CONFIGURAÇÕES FÍSICAS E DE PORTAS DO AGV ELETRON (ROBÔ REAL - RASPBERRY PI 3B)
# ==============================================================================
# Alinhado ao Esquemático KiCad Rev 2.0 (SENAI - Projeto AGV)
# ==============================================================================

serial_bridge:
  ros__parameters:
    # --------------------------------------------------------------------------
    # 1. PORTA SERIAL DO MICROCONTROLADOR (ESP32 DevKit V1)
    # --------------------------------------------------------------------------
    # Opções comuns na Raspberry Pi 3B:
    #   - "/dev/agv_esp32" : Link simbólico persistente criado por scripts/rpi/99-agv-devices.rules
    #   - "/dev/serial0"   : UART física GPIO (Pinos 8/10 da RPi <-> GPIO 16/17 do ESP32 no KiCad)
    #   - "/dev/ttyUSB0"   : Cabo USB direto no ESP32
    serial_port: "/dev/agv_esp32"
    baud_rate: 115200
    serial_timeout: 0.02
    auto_reconnect: true
    mock_serial_if_disconnected: false   # Produção real: nunca simular odometria sem MCU

    # --------------------------------------------------------------------------
    # 2. CONSTANTES FÍSICAS DO ROBÔ (FUSION 360 + KY-040 20:1)
    # --------------------------------------------------------------------------
    wheel_radius: 0.0762                 # Raio da roda motriz de PU (152.4 mm diâmetro)
    wheel_separation: 0.468              # Distância entre centros das rodas motrizes (m)
    encoder_ticks_per_rev: 800           # KY-040 (20 PPR x 2 bordas CHANGE) x redução 20:1 = 800
    max_wheel_speed_rad_s: 15.0          # Velocidade angular máxima (rad/s)

    # Inversão de sentido caso algum motor/encoder gire invertido no teste em cavalete
    invert_left_motor: false
    invert_right_motor: false
    invert_left_encoder: false
    invert_right_encoder: false

    # --------------------------------------------------------------------------
    # 3. PROTOCOLO SERIAL E SEGURANÇA
    # --------------------------------------------------------------------------
    command_format: "wheel_rad_s"
    cmd_vel_timeout_sec: 0.5             # Watchdog de software (ESP32 corta hardware em 200ms)
    publish_odom_tf: true
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    obstacle_stop_distance_m: 0.25       # Distância de parada dos 2x HC-SR04 (metros)


rpi_sensors:
  ros__parameters:
    # --------------------------------------------------------------------------
    # 4. GPIO DA RASPBERRY PI 3B (RELÉS K1/K2) E IMU MPU6050 I2C (KiCad Rev 2.0)
    # --------------------------------------------------------------------------
    enable_gpio: true                    # Ativa controle GPIO na RPi 3B (fallback seguro no PC)
    poll_rate_hz: 20.0
    fan_relay_pin: 17                    # BCM 17 (Pino 11) -> CTRL_FAN -> Relé K1 Ventoinhas 12V
    led_relay_pin: 27                    # BCM 27 (Pino 13) -> CTRL_LED -> Relé K2 Fita LED 5050 12V
    auto_fan_enable: true                # Liga ventoinhas automaticamente quando ROS 2 sobe

    # Entradas opcionais extras (-1 = desativado; E-Stop físico está no GPIO 33 do ESP32)
    emergency_button_pin: -1
    start_button_pin: -1
    obstacle_sensor_pin: -1

    # IMU MPU6050 ligada em I2C BCM 2 (SDA) / BCM 3 (SCL) -> /dev/i2c-1
    enable_imu: true
    i2c_bus: 1
    imu_address: 104                     # 0x68 em decimal
    imu_frame_id: "base_link"


/camera/v4l2_camera:
  ros__parameters:
    # --------------------------------------------------------------------------
    # 5. CÂMERA CSI (bcm2835-v4l2) OU USB OTIMIZADA PARA RASPBERRY PI 3B
    # --------------------------------------------------------------------------
    video_device: "/dev/video0"          # /dev/video0 (CSI via v4l2 ou /dev/agv_cam USB)
    image_size: [320, 240]               # Resolução enxuta conforme contrato (baixa latência RPi 3B)
    time_per_frame: [1, 15]              # 15 FPS estável para processamento OpenCV < 20ms
    camera_frame_id: "camera_link_optical"


rplidar_composition:
  ros__parameters:
    # --------------------------------------------------------------------------
    # 6. SENSOR LIDAR 360° (RPLIDAR A1)
    # --------------------------------------------------------------------------
    serial_port: "/dev/agv_lidar"        # Link udev persistente (ou "/dev/ttyUSB1")
    serial_baudrate: 115200
    frame_id: "laser_frame"
    inverted: false
    angle_compensate: true
    scan_mode: "Standard"
