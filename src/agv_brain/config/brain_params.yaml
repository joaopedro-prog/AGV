# ==============================================================================
# CONFIGURAÇÕES DE VISÃO COMPUTACIONAL E CONTROLE DO SEGUIDOR DE LINHA (AGV)
# ==============================================================================

line_detector:
  ros__parameters:
    image_topic: "/camera/image_raw"
    publish_debug_image: true            # Publica HUD com erro e centróide em /agv/line_debug_image

    # Modo de detecção: "dark_line" (linha preta no piso claro) ou "hsv" (fita colorida)
    detection_mode: "dark_line"

    # Na detecção dark_line:
    # A imagem é normalizada no contraste. Valores abaixo de dark_threshold (0-255) são considerados linha.
    dark_threshold: 85

    # Contraste mínimo (max_val - min_val no cinza) para validar que existe uma linha na cena.
    # Evita falsos positivos de tela inteira escura ou piso sem linha.
    min_contrast: 25.0

    # Faixa HSV caso detection_mode seja "hsv" (Exemplo para fita amarela):
    hsv_lower: [20, 100, 100]
    hsv_upper: [35, 255, 255]

    # Região de Interesse (ROI): parte inferior da imagem onde o chão à frente do robô aparece
    roi_top_ratio: 0.40                  # Inicia em 40% da altura da imagem
    roi_bottom_ratio: 0.95               # Termina em 95% da altura da imagem

    # Filtros de área para descartar ruídos pequenos ou telas inteiras escuras
    min_contour_area: 80.0               # Área mínima da linha (em pixels)
    max_contour_area_ratio: 0.45         # Descarta contornos maiores que 45% da ROI (evita detectar o chão inteiro)


line_follower:
  ros__parameters:
    auto_start: false                    # Se false, inicia em IDLE e aguarda comando START
    cmd_vel_topic: "/cmd_vel_line"       # Conectado à entrada prioritária do twist_mux

    # --------------------------------------------------------------------------
    # VELOCIDADES E GANHOS DO CONTROLADOR PID
    # --------------------------------------------------------------------------
    base_linear_speed: 0.20              # Velocidade em linha reta (m/s)
    min_linear_speed: 0.08               # Velocidade mínima ao contornar curvas (m/s)
    max_angular_speed: 1.50              # Velocidade máxima de giro nas curvas (rad/s)
    curve_slowdown_factor: 0.70          # Reduz velocidade linear proporcionalmente ao erro

    # Ganhos do PID:
    kp: 1.40                             # Força de correção proporcional ao erro
    ki: 0.00                             # Ganho integral
    kd: 0.30                             # Ganho derivativo para amortecer oscilações

    # --------------------------------------------------------------------------
    # BUSCA ATIVA DA LINHA EM CURVAS FECHADAS (QUANDO A LINHA SAI DA CÂMERA)
    # --------------------------------------------------------------------------
    search_on_lost_line: true            # Ativa busca inteligente se perder a linha na curva
    search_linear_speed: 0.04            # Avanço suave durante a busca (m/s)
    search_angular_speed: 0.55           # Rotação suave em direção ao último lado onde a linha foi vista
    max_lost_line_time_sec: 4.0          # Tempo limite de busca antes de parar por segurança (segundos)
    stop_on_obstacle: true               # Pausa imediatamente se houver obstáculo frontal
