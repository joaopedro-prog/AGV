services:
  ros_sim:
    build:
      context: .
      dockerfile: dockerfile
    image: meu-agv:latest
    container_name: meu_container_ros

    stdin_open: true
    tty: true

    network_mode: host
    ipc: host

    environment:
      - DISPLAY=${DISPLAY}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY}
      - XDG_RUNTIME_DIR=/tmp/runtime-user
      - PULSE_SERVER=${PULSE_SERVER}
      - QT_X11_NO_MITSHM=1
      # Aceleração por Hardware GPU Direta (DirectX 12 / Mesa D3D12 vGPU)
      - LIBGL_ALWAYS_SOFTWARE=0
      - GALLIUM_DRIVER=d3d12
      - MESA_D3D12_DEFAULT_ADAPTER_NAME=AMD
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib
      - OGRE_RTT_MODE=FBO

    volumes:
      - .:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /mnt/wslg:/mnt/wslg
      - ${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY}:/tmp/runtime-user/${WAYLAND_DISPLAY}
      - /usr/lib/wsl:/usr/lib/wsl

    devices:
      - /dev/dxg:/dev/dxg
